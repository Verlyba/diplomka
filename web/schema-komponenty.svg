ejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1d22" text-anchor="start" font-weight="bold">runs/&lt;čas&gt;.json</text><text x="52.0" y="488.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">záznam běhu — surová data práce</text><rect x="640.0" y="450.0" width="300.0" height="76.0" rx="5" fill="#f2f4f7" stroke="#1a1d22" stroke-width="1"/><text x="652.0" y="471.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#1a1d22" text-anchor="start" font-weight="bold">inference_daemon.py</text><text x="652.0" y="488.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">podproces, drží ACT policy kroků</text><text x="652.0" y="502.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">měří protokoly A/B</text><rect x="1240.0" y="450.0" width="280.0" height="76.0" rx="5" fill="#eef6ef" stroke="#aab3bd" stroke-width="1"/><text x="1252.0" y="471.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#1a1d22" text-anchor="start" font-weight="bold">Robot SO-101 + kamery</text><text x="1252.0" y="488.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">sériový port (lerobot)</text><text x="1252.0" y="502.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">OpenCV kamery</text><rect x="640.0" y="580.0" width="300.0" height="62.0" rx="5" fill="#ffffff" stroke="#aab3bd" stroke-width="1" stroke-dasharray="4 3"/><text x="652.0" y="601.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1d22" text-anchor="start" font-weight="bold">telemetry/&lt;čas&gt;.jsonl</text><text x="652.0" y="618.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="10" fill="#5c6672" text-anchor="start" font-weight="normal">tik po tiku: klouby, zátěž, sklon</text><line x1="190.0" y1="92.0" x2="190.0" y2="150.0" stroke="#1a1d22" stroke-width="1" marker-end="url(#a)"/><text x="200.0" y="117.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#1a1d22" text-anchor="start" font-weight="normal">HTTP: POST /api/run · /api/stop · GET /api/status</text><text x="200.0" y="129.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#5c6672" text-anchor="start" font-weight="normal">SSE: GET /api/events → log, plan, step, snapshot, state, finished</text><line x1="340.0" y1="188.0" x2="640.0" y2="188.0" stroke="#1a1d22" stroke-width="1" marker-end="url(#a)"/><text x="490.0" y="166.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#1a1d22" text-anchor="middle" font-weight="normal">čte a zapisuje (POST /api/config)</text><text x="490.0" y="178.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#5c6672" text-anchor="middle" font-weight="normal">odsud čte nastavení i orchestrátor</text><line x1="190.0" y1="226.0" x2="190.0" y2="290.0" stroke="#1a1d22" stroke-width="1" marker-end="url(#a)"/><text x="200.0" y="254.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#1a1d22" text-anchor="start" font-weight="normal">přímé volání ve vlákně: Orchestrator.run(instrukce)</text><text x="200.0" y="266.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#5c6672" text-anchor="start" font-weight="normal">zpět: emit() → EventBus → SSE</text><line x1="340.0" y1="328.0" x2="640.0" y2="328.0" stroke="#1a1d22" stroke-width="1" marker-end="url(#a)"/><text x="490.0" y="306.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#1a1d22" text-anchor="middle" font-weight="normal">HTTP (urllib): POST &lt;lm_url&gt;/chat/completions</text><text x="490.0" y="