 sans-serif" font-size="9.5" fill="#1a1d22" text-anchor="start" font-weight="normal">zapisuje průběžně</text><text x="40.0" y="690.0" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5c6672" text-anchor="start" font-weight="normal">Plný rámeček = proces, čárkovaný = soubor na disku. Barva: šedá = vlastní kód, oranžová = externí služba, zelená = hardware.</text></svg>